<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Nathavaram voter list{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="brand">
      <p class="eyebrow">Andhra Pradesh</p>
      <a href="/voters">Nathavaram</a>
      <p class="tag">Village voter list</p>
    </div>
    {% if user %}
    <nav class="nav" aria-label="Primary">
      <a href="/voters">Voters</a>
      <a href="/reports">Reports</a>
      {% if user.role == "admin" %}<a href="/import">Import</a>{% endif %}
      {% if user.role == "admin" %}<a href="/users">Users</a>{% endif %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="linkish">Log out</button>
      </form>
    </nav>
    <p class="who">{{ user.username }} · {{ user.role }}</p>
    {% endif %}
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
