{% extends "base.html" %}
{% block title %}Sign in · Nathavaram{% endblock %}
{% block content %}
<section class="login-card">
  <p class="eyebrow">Authorised users only</p>
  <h1>Sign in</h1>
  <p class="lede">This list holds personal details, including caste, party, and mobile numbers. Do not share your password.</p>
  {% if error %}<p class="banner bad" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
