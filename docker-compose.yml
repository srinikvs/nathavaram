# Local or later Jenkins deploy. Secrets come from .env, which is not in git.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/nathavaram.db
      APP_ENV: production
      # The app refuses to start in production unless cookies are Secure. Put HTTPS in front.
      COOKIE_SECURE: "true"
    volumes:
      - voter-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  voter-data:
